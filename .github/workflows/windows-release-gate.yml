name: Windows release gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-install-and-repair:
    name: ${{ matrix.runner }} clean install and repair
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-2022
          - windows-2025
          - windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      PYTHONNOUSERSITE: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build and freshly extract the exact release ZIP
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'Mass-Installer-v1.0.15.zip'
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'mass release qa'
          if ((Test-Path -LiteralPath $archive) -or (Test-Path -LiteralPath $releaseRoot)) {
            throw 'The release test paths must start empty.'
          }
          & './scripts/Build-ReleaseZip.ps1' -OutputPath $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $releaseRoot
          [IO.File]::AppendAllText($env:GITHUB_ENV, "FLEECE_RELEASE_ROOT=$releaseRoot`n", [Text.UTF8Encoding]::new($false))

      - name: Run the native setup release gate
        id: native-setup
        shell: powershell
        env:
          FLEECE_ALLOW_TRUSTED_OLD_WINGET: ${{ matrix.runner == 'windows-2025' && '1' || '0' }}
          FLEECE_REQUIRE_TRUSTED_WINGET: ${{ matrix.runner == 'windows-11-arm' && '1' || '0' }}
        run: '& ".github/scripts/Test-MassReleaseGate.ps1" -ReleaseRoot $env:FLEECE_RELEASE_ROOT'

      - name: Upload diagnostics if a gate fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: setup-diagnostics-${{ matrix.runner }}-${{ github.run_id }}
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
          path: |
            setup.log
            .runtime/error.log
            .runtime/logs/*.log
            ${{ runner.temp }}/mass release qa/setup.log
            ${{ runner.temp }}/mass release qa/.runtime/error.log
            ${{ runner.temp }}/mass release qa/.runtime/logs/*.log
