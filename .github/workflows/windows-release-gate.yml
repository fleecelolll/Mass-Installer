name: Windows release gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-install-and-repair:
    name: ${{ matrix.runner }} clean install and repair
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-2022
          - windows-2025
          - windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      PYTHONNOUSERSITE: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run the native setup release gate
        id: native-setup
        shell: powershell
        env:
          FLEECE_ALLOW_TRUSTED_OLD_WINGET: ${{ matrix.runner == 'windows-2025' && '1' || '0' }}
        run: '& ".github/scripts/Test-MassReleaseGate.ps1"'

      - name: Upload diagnostics if a gate fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: setup-diagnostics-${{ matrix.runner }}-${{ github.run_id }}
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
          path: |
            setup.log
            .runtime/error.log
            .runtime/logs/*.log
